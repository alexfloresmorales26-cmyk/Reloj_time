<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reloj Digital | Reloj_time</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Fondo nocturno urbano -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="container">
    <header class="header">
      <div class="logo">Reloj_time</div>
      <div class="date" id="date">Lunes, 1 de enero de 2026</div>
    </header>

    <main class="clock-card">
      <!-- Temporizador principal (estilo Pomodoro) -->
      <div class="timer-circle">
        <div class="time" id="time">00:00:00</div>
        <div class="period" id="period">AM</div>
        <div class="timer-label" id="timerLabel">Sesión de Reloj</div>
      </div>

      <div class="timer-controls">
        <button class="btn btn-secondary" id="startTimer">
          <span class="btn-icon">▶️</span>
          <span class="btn-label">Iniciar sesión</span>
        </button>
        <button class="btn btn-secondary" id="pauseTimer">
          <span class="btn-icon">⏸️</span>
          <span class="btn-label">Pausar</span>
        </button>
        <button class="btn btn-secondary" id="resetTimer">
          <span class="btn-icon">🔄</span>
          <span class="btn-label">Reiniciar</span>
        </button>
      </div>

      <div class="timer-settings">
        <label class="setting">
          <span>Minutos</span>
          <input type="number" id="timerMinutes" min="1" max="120" value="25" />
        </label>
        <label class="setting">
          <span>Sonido</span>
          <select id="soundSelect">
            <option value="none">Ninguno</option>
            <option value="ding">Ding</option>
            <option value="chime">Chime</option>
            <option value="bell">Campana</option>
          </select>
        </label>
      </div>

      <div class="motivational-quote" id="quote">
        «La motivación te pone en marcha; el hábito te mantiene en marcha.»
      </div>

      <!-- Controles inferiores -->
      <div class="bottom-controls">
        <button class="btn-icon-only" id="toggleTheme" title="Modo claro/oscuro">
          🌙
        </button>
        <button class="btn-icon-only" id="toggle12" title="Formato 12/24h">
          🕒
        </button>
        <button class="btn-icon-only" id="toggleBg" title="Cambiar fondo">
          🖼️
        </button>
      </div>
    </main>

    <!-- Selector de fondos -->
    <div class="bg-selector" id="bgSelector">
      <div class="selector-header">
        <span>Fondo</span>
        <button class="close-selector" id="closeBg">✕</button>
      </div>
      <div class="bg-options" id="bgOptions"></div>
    </div>
  </div>

  <audio id="timerSound" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
