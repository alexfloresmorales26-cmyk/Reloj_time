<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reloj digital con temporizador de sesión, fondos personalizables y modo claro/oscuro. Tu hora, con estilo." />
  <meta name="theme-color" content="#070911" id="themeColor" />
  <title>Reloj_time — Reloj digital y temporizador</title>

  <script>
    (function () {
      try {
        const isLight = localStorage.getItem("reloj_theme") === "light";
        if (isLight) document.documentElement.classList.add("light");
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.content = isLight ? "#edf0f6" : "#070911";
        }
      } catch (error) {}
    })();
  </script>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>

  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.75v12.5L18.5 12 8 5.75Z" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M9 5.5v13M15 5.5v13" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24">
        <path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z" />
        <path d="M16 9h2a2.5 2.5 0 0 1 0 5h-2" />
        <path d="M7 3.5v2M11 3.5v2" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.5V12l3 2" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="9" cy="9" r="1.8" />
        <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
    </defs>
  </svg>

  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

  <div class="wrap">
    <header class="header">
      <h1 class="brand" aria-label="Reloj_time">
        <span class="mark">time<span class="mark-dot" aria-hidden="true">.</span></span>
      </h1>
      <time class="date" id="date" datetime="2026-01-01">Lunes, 1 de enero de 2026</time>
    </header>

    <main id="main" class="clock-section">
      <div class="hero" id="hero" data-state="idle">
        <svg class="timer-ring" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
          <circle class="ring-track" cx="160" cy="160" r="152"></circle>
          <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="152" transform="rotate(-90 160 160)"></circle>
        </svg>
        <div class="timer-ring-inner" aria-hidden="true"></div>
        <div class="hero-content">
          <div class="time" id="time" role="timer" aria-live="off">00:00:00</div>
          <div class="hero-meta">
            <span class="period" id="period">AM</span>
            <span class="session-state" id="sessionState" aria-live="polite" hidden></span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startTimer" type="button">
          <span class="btn-icon" aria-hidden="true"><svg class="icon"><use href="#i-play"></use></svg></span>
          <span class="btn-label" id="startLabel">Iniciar</span>
        </button>
        <button class="btn" id="pauseTimer" type="button" disabled>
          <span class="btn-icon" aria-hidden="true"><svg class="icon"><use href="#i-pause"></use></svg></span>
          <span class="btn-label">Pausar</span>
        </button>
        <button class="btn" id="resetTimer" type="button" disabled>
          <span class="btn-icon" aria-hidden="true"><svg class="icon"><use href="#i-reset"></use></svg></span>
          <span class="btn-label">Reiniciar</span>
        </button>
      </div>

      <div class="mode-toggle" role="group" aria-label="Modo de sesión">
        <button class="mode-btn active" id="modeFocus" type="button" data-mode="focus" aria-pressed="true">
          <svg class="icon mode-icon" aria-hidden="true"><use href="#i-target"></use></svg>
          <span class="mode-label">Concentración</span>
        </button>
        <button class="mode-btn" id="modeBreak" type="button" data-mode="break" aria-pressed="false">
          <svg class="icon mode-icon" aria-hidden="true"><use href="#i-coffee"></use></svg>
          <span class="mode-label">Descanso</span>
        </button>
      </div>

      <div class="settings">
        <label class="setting" for="timerMinutes">
          <span class="setting-label">Minutos</span>
          <input type="number" id="timerMinutes" min="1" max="120" step="1" inputmode="numeric" value="25" />
        </label>
        <label class="setting" for="soundSelect">
          <span class="setting-label">Sonido al terminar</span>
          <select id="soundSelect">
            <option value="none">Ninguno</option>
            <option value="ding">Ding</option>
            <option value="chime">Chime</option>
            <option value="bell">Campana</option>
          </select>
        </label>
      </div>

      <p class="quote">«La motivación te pone en marcha; el hábito te mantiene en marcha.»</p>

      <div class="bottom" role="group" aria-label="Ajustes rápidos">
        <button class="icon-btn" id="toggleTheme" type="button" title="Activar modo claro" aria-label="Activar modo claro">
          <span class="theme-icon theme-sun" aria-hidden="true"><svg class="icon"><use href="#i-sun"></use></svg></span>
          <span class="theme-icon theme-moon" aria-hidden="true"><svg class="icon"><use href="#i-moon"></use></svg></span>
        </button>
        <button class="icon-btn" id="toggle12" type="button" title="Cambiar a formato de 24 horas" aria-label="Cambiar a formato de 24 horas" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg>
          <span class="format-badge" id="formatBadge" aria-hidden="true">12</span>
        </button>
        <button class="icon-btn bg-btn" id="toggleBg" type="button" title="Cambiar fondo" aria-label="Cambiar fondo" aria-expanded="false" aria-haspopup="dialog">
          <span class="bg-preview" id="bgPreview" aria-hidden="true"></span>
          <span class="bg-icon" aria-hidden="true"><svg class="icon"><use href="#i-image"></use></svg></span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Reloj_time. Construido con cuidado.</p>
    </footer>
  </div>

  <div class="bg-selector" id="bgSelector" hidden>
    <div class="selector-panel" role="dialog" aria-modal="true" aria-labelledby="bgSelectorTitle">
      <div class="selector-head">
        <div>
          <h2 class="selector-title" id="bgSelectorTitle">Fondo</h2>
          <p class="selector-sub">Elige el ambiente de tu sesión.</p>
        </div>
        <button class="icon-btn close-selector" id="closeBg" type="button" title="Cerrar" aria-label="Cerrar selector de fondos">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="bg-options" id="bgOptions"></div>
    </div>
  </div>

  <audio id="timerSound" preload="auto"></audio>

  <script src="script.js?v=10"></script>
</body>
</html>
