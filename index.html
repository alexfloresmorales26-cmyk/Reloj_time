<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft" data-buttons="solid|pill" data-motion>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="page-type" content="software" />
  <meta name="site-kind" content="software" />
  <meta name="description" content="Reloj digital con temporizador de sesión, fondos nocturnos y modo oscuro. Tu hora, con estilo." />
  <title>Reloj Digital | Reloj_time</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-mouse" id="bgMouse"></div>

  <div class="wrap">
    <header class="header">
      <div class="brand">
        <span class="mark">time</span>
      </div>
      <time class="date" id="date">Lunes, 1 de enero de 2026</time>
    </header>

    <main id="main" class="clock-section">
      <div class="hero">
        <div class="timer-ring"></div>
        <div class="timer-ring-inner"></div>
        <div class="time" id="time">00:00:00</div>
        <div class="period" id="period">AM</div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startTimer">
          <span class="btn-icon">▶️</span>
          <span class="btn-label">Iniciar sesión</span>
        </button>
        <button class="btn btn-outline" id="pauseTimer">
          <span class="btn-icon">⏸️</span>
          <span class="btn-label">Pausar</span>
        </button>
        <button class="btn btn-outline" id="resetTimer">
          <span class="btn-icon">🔄</span>
          <span class="btn-label">Reiniciar</span>
        </button>
      </div>

      <div class="mode-toggle" role="group" aria-label="Modo de temporizador">
        <button class="mode-btn active" id="modeFocus" data-mode="focus" aria-pressed="true">
          <span class="mode-icon">🎯</span>
          <span class="mode-label">Concentración</span>
        </button>
        <button class="mode-btn" id="modeBreak" data-mode="break" aria-pressed="false">
          <span class="mode-icon">☕</span>
          <span class="mode-label">Descanso</span>
        </button>
      </div>

      <div class="settings">
        <label class="setting">
          <span class="setting-label">Minutos</span>
          <input type="number" id="timerMinutes" min="1" max="120" value="25" />
        </label>
        <label class="setting">
          <span class="setting-label">Sonido al terminar</span>
          <select id="soundSelect">
            <option value="none">Ninguno</option>
            <option value="ding">Ding</option>
            <option value="chime">Chime</option>
            <option value="bell">Campana</option>
          </select>
        </label>
      </div>

      <p class="quote" id="quote">
        «La motivación te pone en marcha; el hábito te mantiene en marcha.»
      </p>

      <div class="bottom">
        <button class="icon-btn" id="toggleTheme" title="Modo claro/oscuro" aria-label="Cambiar tema claro/oscuro" aria-pressed="false">
          🌙
        </button>
        <button class="icon-btn" id="toggle12" title="Formato 12/24 horas" aria-label="Cambiar formato 12 o 24 horas" aria-pressed="false">
          🕒
        </button>
        <button class="icon-btn" id="toggleBg" title="Cambiar fondo" aria-label="Cambiar fondo" aria-expanded="false">
          <span class="bg-preview" id="bgPreview"></span>
          <span class="bg-icon">🖼️</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Reloj_time. Construido con cuidado.</p>
    </footer>
  </div>

  <div class="bg-selector" id="bgSelector" hidden>
    <div class="selector-panel">
      <div class="selector-head">
        <h3 class="selector-title">Fondo</h3>
        <button class="icon-btn close-selector" id="closeBg" title="Cerrar" aria-label="Cerrar selector de fondos">✕</button>
      </div>
      <div class="bg-options" id="bgOptions"></div>
    </div>
  </div>

  <audio id="timerSound" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
